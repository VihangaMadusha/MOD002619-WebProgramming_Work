{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vihanga's University</title>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet" />
    <style>
        .navbar { background-color: #1f4e8c !important; }
        .navbar .navbar-brand, .navbar .nav-link { color: #fff !important; }
        .navbar .nav-link.active { border-bottom: 2px solid #f2b134; }
        footer { margin-top: 40px; padding: 15px; text-align: center; background: #eaf1fb; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'myApp:home' %}">Vihanga's University</a>
            <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="{% url 'myApp:home' %}">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'myApp:studentlist' 1 %}">Students</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'myApp:modulelist' %}">Modules</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}
        {% endblock %}

        {% block pagination %}
        {% endblock %}
    </div>

    <footer><i>Vihanga's University &ndash; created by Vihanga Masdusha</i></footer>

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
