{% extends "base.html" %}
{% block content %}
<h2>Modules</h2>
<table class="table table-striped table-hover">
    <thead class="table-dark">
        <tr><th scope="col">Code</th><th scope="col">Name</th><th scope="col">Students enrolled</th></tr>
    </thead>
    <tbody>
    {% for module in modules %}
        <tr>
            <th scope="row">{{ module.code|upper }}</th>
            <td>{{ module.name }}</td>
            <td>{{ module.student_set.count }}</td>
        </tr>
    {% empty %}
        <tr><td colspan="3" class="text-center">No modules.</td></tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
