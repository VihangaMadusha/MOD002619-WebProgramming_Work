<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bill Splitter - Task 2</title>
<link rel="stylesheet" href="styles.css">
<script src="task2.js"></script></head>
<body><div class="container">
<h1>Bill Splitter with items</h1>
<nav><a href="task1.html">Task 1</a><a href="task2.html">Task 2</a><a href="task3.html">Task 3</a><a href="Changeling.html">Changeling demo</a></nav>

<h3>Menu items</h3>
<label for="itemName">Item</label>
<input id="itemName" type="text" placeholder="e.g. Margherita pizza">
<label for="itemCost">Cost</label>
<input id="itemCost" type="text" placeholder="e.g. 11.95">
<button type="button" id="addItem">Add item</button>
<div id="itemErrors" class="error-box" style="display:none"></div>

<table>
    <thead><tr><th>Item</th><th>Cost</th><th></th></tr></thead>
    <tbody id="itemRows"></tbody>
    <tfoot><tr><th>Subtotal</th><th id="subtotal">0.00</th><th></th></tr></tfoot>
</table>

<label for="tipRate">Tip rate</label>
<select id="tipRate">
    <option value="">-- select --</option>
    <option value="0">0%</option><option value="5">5%</option><option value="10">10%</option>
    <option value="15">15%</option><option value="20">20%</option>
</select>

<label for="numPeople">Number of people</label>
<input id="numPeople" type="text" placeholder="e.g. 4">

<button type="button" id="calculate">Calculate</button>
<div id="errors" class="error-box" style="display:none"></div>
<div id="result"></div>
</div></body></html>
