<body><div class="container">
<h1>Bill Splitter</h1>

<label for="billAmount">Total bill amount</label>
<input id="billAmount" type="text" placeholder="e.g. 85.50">

<label for="tipRate">Tip rate</label>
<select id="tipRate">
    <option value="">-- select --</option>
    <option value="0">0%</option>
    <option value="5">5%</option>
    <option value="10">10%</option>
    <option value="15">15%</option>
    <option value="20">20%</option>
</select>

<label for="numPeople">Number of people</label>
<input id="numPeople" type="text" placeholder="e.g. 4">

<button type="button" id="calculate">Calculate</button>

<div id="errors" class="error-box" style="display:none"></div>
<div id="result" class="result-holder"></div>
</div></body></html>
